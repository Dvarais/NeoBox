# Проверки, которые до сих пор запускались только вручную и только когда о них
# вспоминали.
#
# Всё, что здесь есть, уже было написано — тесты Go по пяти пакетам, строгая
# сверка типов фронтенда и прогон движка тем на контраст. Не хватало ровно
# одного: места, где это выполняется само. Обещание «любая правка движка тем
# обязана пройти check:theme» из PRODUCT.md без такого места остаётся
# комментарием.
#
# Раннер только windows-latest, и это не выбор ради удобства. Половина бэкенда
# обращается к Windows API напрямую — DPAPI в security/encryption.go, правила
# брандмауэра в service/killswitch.go, реестр в security/scheduler.go, systray,
# WebView2, — и на Linux этот код просто не компилируется. Проверять на другой
# платформе было бы нечего.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: раннер под Windows
# медленный и дорогой, а результат устаревшего коммита никому не нужен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версия берётся из go.mod, чтобы не разъезжаться с ней молча.
          go-version-file: go.mod
          cache: true

      # Теги обязательны и здесь, а не только в релизной сборке: без with_quic
      # и with_wireguard часть outbound'ов ядра не собирается вовсе, и проверка
      # прошла бы по коду, которого в приложении нет.
      - name: go vet
        run: go vet -tags "with_utls,with_clash_api,with_quic,with_wireguard,with_gvisor" ./...

      - name: go test
        run: go test -tags "with_utls,with_clash_api,with_quic,with_wireguard,with_gvisor" ./...

  backend-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go test (Linux)
        run: go test -tags "with_utls,with_clash_api,with_quic,with_wireguard,with_gvisor" ./backend/platform/...

      - name: Build & Package Linux (.deb)
        run: |
          chmod +x build/linux/build_linux.sh
          ./build/linux/build_linux.sh

      - name: Upload Debian Package (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: neobox_1.8.1_amd64.deb
          path: build/bin/neobox_1.8.1_amd64.deb
          if-no-files-found: error

      - name: Upload Linux Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: neobox-linux-amd64
          path: build/bin/neobox
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Прогон движка тем: восемь пресетов, набор крайних случаев и четыре
      # тысячи случайных тем против порога контраста 4.5:1, плюс совпадение
      # стандартной темы со style.css. Детерминирован и возвращает ненулевой
      # код при провале — см. PRODUCT.md, обязательство бренда №2.
      - name: check:theme
        run: npm run check:theme

      # build сам начинается с `tsc --noEmit`, поэтому отдельного шага для
      # сверки типов не нужно: ошибка типов ломает сборку.
      - name: build
        run: npm run build
